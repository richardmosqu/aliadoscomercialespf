            alternativas: [criptofacil]
          - id: otro
            texto: La palabra se usa en otro sentido (por ejemplo, tokens de software)
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: No opera con criptomonedas; la palabra clave era un falso positivo.

