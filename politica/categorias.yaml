  - id: apuestas
    nombre: Apuestas y juegos de azar
    nivel: no_aplica
    origen: publica
    por_que: Los términos y condiciones de PagueloFacil excluyen las apuestas y los juegos de azar.
    palabras_clave: [apuesta*, apostar, casino*, loteria*, lotto, rifa*, sorteo*, bingo*, tragamoneda*, slots, poker,
      ruleta*, quiniela*, chance, chances, pronostico*, juegos de azar, parley, parlay, raspadit*]
    alternativas: [expediente_comite]
