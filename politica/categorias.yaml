            corto: "🏆 Torneo de habilidad"
            nivel: aplica
            motivo: >-
              Inscripción a una competencia de habilidad: es un evento, no un juego de azar (si el premio es dinero y
              depende de la suerte, cambia a apuestas).
            activa: [experiencias_eventos]
          - id: sin_apuestas
            texto: Nada de apuestas (la palabra se usa en otro sentido)
            corto: "🙅 Nada de apuestas"
            descarta: true
            motivo: No hay apuestas ni juegos de azar; la palabra clave era un falso positivo.

