            nivel: comite
            motivo: Las recargas son valor almacenado con alto riesgo de fraude; el comité decide (por confirmar).
            alternativas: [expediente_comite]
          - id: cuentas_juego
            texto: Cuentas, ítems o servicios dentro de juegos (cuentas con nivel, boosting)
            corto: "Cuentas de juegos"
            nivel: comite
            motivo: Venta de cuentas o ítems de juegos; alto riesgo de fraude y de reclamos, el comité decide (por confirmar).
          - id: propias
            texto: Tarjetas de regalo propias, que solo se canjean en su negocio
            corto: "🎁 Tarjetas de regalo propias"
            descarta: true
            motivo: Una tarjeta de regalo propia es parte de su venta normal.
            alternativas: [gift_cards_propias]
          - id: videojuegos
            texto: Videojuegos físicos, consolas o accesorios
            corto: "🕹️ Videojuegos o consolas"
            descarta: true
            motivo: Venta de productos al detalle; no son tarjetas ni saldo.
          - id: otro
            texto: La palabra se usa en otro sentido
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: No vende tarjetas ni saldo; la palabra clave era un falso positivo.

      - id: tarjetas_excluir
        clave: true
        mostrar_si: {tarjetas_que_vende: [terceros]}
        texto: ¿Vende además productos permitidos y acepta no cobrar las tarjetas ni el saldo con PagueloFacil?
        corta: "¿Acepta no cobrar las tarjetas con nosotros?"
        ayuda: Por ejemplo, una tienda de videojuegos que también vende tarjetas de PlayStation.
        opciones:
          - id: si_mayoria_permitida
            texto: Sí, y lo permitido es la mayor parte de su negocio
            corto: "Sí, es una parte pequeña"
            tope: condicionado
            motivo: Se afilia solo la línea permitida, con carta compromiso de exclusión.
            documentos: [carta_exclusion]
            alternativas: [afiliar_linea_permitida]
          - id: "no"
            texto: "No"
            corto: "No"

  # ───────────────────────────── Propuestas (por validar con Cumplimiento) ─────────────────────────────

  - id: replicas
    nombre: Réplicas, falsificaciones y reventa no autorizada
    nivel: comite
    origen: propuesta
    por_que: >-
      Las marcas de tarjeta prohíben procesar productos falsificados o que violan la propiedad intelectual. Vender
      originales o productos sin marca de terceros sí aplica.
    palabras_clave: [replica*, imitacion*, "1:1", aaa, triple a, clon*, tipo original, calidad original, copia*,
      pirata*, pirateria, iptv, cuentas de streaming, cuentas premium, perfiles de netflix, netflix, spotify premium,
      cuentas compartidas]
    alternativas: [productos_originales, afiliar_linea_permitida]
    preguntas:
      - id: replicas_que_vende
        clave: true
        texto: ¿Qué vende exactamente?
        opciones:
          - id: replicas_marca
            texto: Réplicas o imitaciones con marca o logo de terceros (AAA, 1:1)
            corto: "Réplicas de marca"
            nivel: no_aplica
            motivo: Productos falsificados; violan la propiedad intelectual y las reglas de las marcas de tarjeta (propuesta).
          - id: streaming
            texto: Cuentas o perfiles de streaming, IPTV o licencias revendidas sin autorización
            corto: "📺 Cuentas de streaming"
            nivel: no_aplica
            motivo: Reventa no autorizada de servicios digitales (propuesta).
          - id: originales
            texto: Productos originales de marca (importador, revendedor o distribuidor autorizado)
            corto: "✅ Originales de marca"
            nivel: condicionado
            motivo: Reventa de marcas; pedir prueba de que son originales.
            documentos: [autorizacion_marca]
          - id: genericos
            texto: Productos genéricos o "inspirados" sin marca ni logos de terceros
            corto: "Genéricos sin marca"
            descarta: true
            motivo: Productos sin marca de terceros; no hay falsificación.
          - id: otro
            texto: La palabra se usa en otro sentido (fotocopias, copias de llaves, réplicas a escala)
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: No hay falsificación; la palabra clave era un falso positivo.

      - id: replicas_excluir
        clave: true
        mostrar_si: {replicas_que_vende: [replicas_marca]}
        texto: ¿Vende además productos originales o sin marca y acepta no cobrar las réplicas con PagueloFacil?
        corta: "¿Acepta no cobrar las réplicas con nosotros?"
        opciones:
          - id: si_mayoria_permitida
            texto: Sí, y lo permitido es la mayor parte de su negocio
            corto: "Sí, es una parte pequeña"
            tope: comite
            motivo: Afiliación parcial de un comercio que vende réplicas; el comité decide.
            documentos: [carta_exclusion, autorizacion_marca]
            alternativas: [afiliar_linea_permitida, expediente_comite]
          - id: "no"
            texto: "No"
            corto: "No"

  - id: multinivel
    nombre: Multinivel y esquemas de reclutamiento
    nivel: comite
    origen: propuesta
    por_que: >-
      La venta directa de productos es legítima. Un esquema donde el ingreso depende de reclutar personas o de
      prometer rendimientos es piramidal y puede ser ilegal.
    palabras_clave: [multinivel, mlm, network marketing, mercadeo en red, red de mercadeo, piramid*, ingresos pasivos,
      oportunidad de negocio, libertad financiera, gana dinero, invita y gana, downline, upline, venta directa,
      venta por catalogo]
    alternativas: [venta_directa_producto]
    preguntas:
      - id: multinivel_ingresos
        clave: true
        texto: ¿De dónde vienen principalmente los ingresos?
        opciones:
          - id: productos
            texto: De vender productos a consumidores finales (venta directa o por catálogo)
            corto: "🛍️ De vender productos"
            nivel: condicionado
            motivo: Venta directa de productos; aplica si el ingreso viene de la venta y no del reclutamiento.
            documentos: [descripcion_ampliada]
            alternativas: [venta_directa_producto]
          - id: reclutamiento
            texto: De inscripciones, paquetes de entrada o reclutar personas
            corto: "👥 De reclutar personas"
            nivel: no_aplica
            motivo: El ingreso depende de reclutar personas; es un esquema piramidal (propuesta).
          - id: rendimientos
            texto: De prometer rendimientos o ganancias por invertir
            corto: "📈 De prometer ganancias"
            nivel: no_aplica
            motivo: Promesa de rendimientos; captación de dinero no autorizada (propuesta).
          - id: otro
            texto: No es una red ni un esquema (la palabra se usa en otro sentido)
            corto: "🙅 No es una red"
            descarta: true
            motivo: No es un multinivel; la palabra clave era un falso positivo.

  - id: facilitador_terceros
    nombre: Cobros a nombre de terceros e intermediación
    nivel: comite
    origen: propuesta
    por_que: >-
      Si el comercio cobra por cuenta de otros, PagueloFacil no conoce a quien de verdad vende (riesgo de facilitación
      de pagos o transaction laundering).
    palabras_clave: [marketplace, agregador*, a nombre de terceros, por cuenta de terceros, intermediari*,
      comisionista*, cobrar por otros, revendedor*, dropshipping, subcomercio*, pasarela de pago*, agencia de cobro*,
      cobranza*]
    alternativas: [afiliacion_individual_vendedores, expediente_comite]
    preguntas:
      - id: terceros_modelo
        clave: true
        texto: ¿Para quién es el dinero que cobra?
        opciones:
          - id: propio
            texto: Para el propio comercio; vende sus productos o servicios (aunque use proveedores)
            corto: "Para él mismo"
            descarta: true
            motivo: Cobra su propia venta; no es intermediación.
          - id: dropshipping
            texto: Para el propio comercio, pero el producto lo despacha un proveedor (dropshipping)
            corto: "📦 Dropshipping"
            nivel: condicionado
            motivo: Dropshipping; el comercio responde por la entrega y hay riesgo de contracargo por demoras.
            condiciones: [Tiempos de entrega, rastreo y política de devoluciones publicados.]
            alternativas: [publicar_politicas]
          - id: terceros
            texto: Para otros vendedores o prestadores, y el comercio se queda con una comisión (marketplace, plataforma, agencia)
            corto: "🏪 Para otros vendedores"
            nivel: comite
            motivo: Cobrar por cuenta de terceros convierte al comercio en un facilitador de pagos; el comité decide.
            documentos: [contrato_vendedores]
            alternativas: [afiliacion_individual_vendedores, expediente_comite]
          - id: pasarela
            texto: Quiere ofrecer el cobro con PagueloFacil a otros comercios (ser pasarela o subadquirente)
            corto: "🔌 Quiere ser pasarela"
            nivel: comite
            motivo: Modelo de facilitador de pagos; requiere un acuerdo especial con Comercial y Cumplimiento.
          - id: cobranza
            texto: Cobra deudas o cuotas de terceros (agencia de cobros)
            corto: "Cobranza de deudas"
            nivel: comite
            motivo: Cobranza por cuenta de terceros; el comité decide (por confirmar).
            documentos: [contrato_vendedores]

  - id: servicios_financieros
    nombre: Servicios financieros
    nivel: comite
    origen: propuesta
    por_que: Son actividades reguladas; el comercio necesita la licencia de su regulador.
    palabras_clave: [prestamo*, creditos personales, financiamiento*, financiera*, casa de empeno, empeno*,
      cambio de divisas, casa de cambio, remesa*, envio de dinero, envios de dinero, inversion*, invertir, forex,
      trading, senales de trading, fondo de inversion, corredor de seguros, aseguradora*, poliza*, cooperativa*,
      billetera digital, factoring]
    alternativas: [expediente_comite]
    preguntas:
      - id: financiero_que_hace
        clave: true
        texto: ¿Qué servicio financiero cobra?
        opciones:
          - id: prestamos
            texto: Presta dinero o cobra cuotas de su financiamiento (financiera, casa de empeño, cooperativa)
            corto: "💵 Préstamos o empeño"
            nivel: comite
            motivo: Actividad financiera regulada; el comité valida la licencia.
            documentos: [licencia_financiera]
          - id: seguros
            texto: Vende seguros como corredor o aseguradora
            corto: "🛡️ Seguros"
            nivel: condicionado
            motivo: Seguros; aplica con la licencia de la Superintendencia de Seguros.
            documentos: [licencia_financiera, idoneidad_profesional]
          - id: inversiones
            texto: Inversiones, trading, forex, fondos o promesas de rendimientos
            corto: "📈 Inversiones o trading"
            nivel: comite
            motivo: Inversiones y trading; alto riesgo de fraude, el comité valida la licencia del regulador de valores.
            documentos: [licencia_financiera]
          - id: remesas
            texto: Remesas, cambio de divisas, billeteras o envío de dinero
            corto: "💸 Remesas o cambio"
            nivel: comite
            motivo: Transmisión de dinero; actividad regulada con alto riesgo de blanqueo, el comité decide.
            documentos: [licencia_financiera, origen_fondos]
          - id: financia_venta
            texto: Vende sus propios productos a cuotas (financia su propia venta)
            corto: "Vende a cuotas"
            descarta: true
            motivo: Financiar su propia venta no es una actividad financiera; es su venta normal.
          - id: otro
            texto: La palabra se usa en otro sentido (por ejemplo, "aceptamos financiamiento")
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: No presta servicios financieros; la palabra clave era un falso positivo.

  - id: alto_valor
    nombre: Bienes de alto valor (joyas, metales, inmuebles, vehículos)
    nivel: condicionado
    origen: propuesta
    por_que: >-
      Son actividades de mayor riesgo de blanqueo de capitales (sujetos obligados no financieros, Ley 23 de 2015;
      verificar con Cumplimiento). Aplican con debida diligencia reforzada y límites a la medida.
    palabras_clave: [joyeria*, joyas, oro, metales preciosos, piedras preciosas, relojes de lujo, rolex,
      bienes raices, inmobiliari*, venta de autos, autos usados, venta de vehiculos, concesionari*, compra de oro,
      compro oro, lingote*]
    alternativas: [aumento_limite, limites_iniciales]
    preguntas:
      - id: alto_valor_que_vende
        clave: true
        texto: ¿Qué vende exactamente?
        opciones:
          - id: joyeria
            texto: Joyería, relojes o artículos de lujo al detalle
            corto: "💍 Joyería o lujo"
            nivel: condicionado
            motivo: Artículos de alto valor; debida diligencia reforzada y límites por transacción.
            documentos: [origen_fondos]
          - id: metales
            texto: Compra o venta de oro, metales o piedras preciosas como inversión (incluye "compro oro")
            corto: "🥇 Oro como inversión"
            nivel: comite
            motivo: Metales y piedras preciosas como inversión; mayor riesgo de blanqueo, el comité decide.
            documentos: [origen_fondos, licencia_financiera]
          - id: inmuebles_vehiculos
            texto: Bienes raíces o vehículos (reservas, abonos o ventas)
            corto: "🏠 Inmuebles o autos"
            nivel: condicionado
            motivo: Montos altos; límites a la medida y debida diligencia reforzada.
            documentos: [origen_fondos]
          - id: otro
            texto: La palabra se usa en otro sentido (bisutería, accesorios económicos)
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: No vende bienes de alto valor; la palabra clave era un falso positivo.

  - id: esoterismo_citas
    nombre: Servicios esotéricos y de citas
    nivel: comite
    origen: propuesta
    por_que: Las marcas de tarjeta los tratan como de alto riesgo por sus niveles de contracargos y reclamos.
    palabras_clave: [tarot, astrolog*, horoscopo*, videncia, vidente*, psiquic*, brujeria, brujo*, amarre*, hechizo*,
      santeria, limpias, lectura de cartas, carta astral, numerolog*, citas en linea, agencia matrimonial,
      sitio de citas, dating]
    alternativas: [publicar_politicas, limites_iniciales, expediente_comite]
    preguntas:
      - id: esoterismo_que_vende
        clave: true
        texto: ¿Qué vende exactamente?
        opciones:
          - id: consultas
            texto: Consultas o trabajos esotéricos (tarot, videncia, amarres, trabajos espirituales)
            corto: "🔮 Consultas esotéricas"
            nivel: comite
            motivo: Servicios esotéricos; alto nivel de contracargos y reclamos, el comité decide (por confirmar).
          - id: citas
            texto: Servicios de citas o búsqueda de pareja
            corto: "💘 Citas o pareja"
            nivel: comite
            motivo: Servicios de citas; alto nivel de contracargos y reclamos, el comité decide (por confirmar).
          - id: productos_talleres
            texto: Productos o talleres de bienestar (velas, inciensos, cristales, meditación, astrología como entretenimiento)
            corto: "🕯️ Productos o talleres"
            descarta: true
            motivo: Venta de productos o talleres; es comercio al detalle o educación.
          - id: otro
            texto: La palabra se usa en otro sentido
            corto: "🙅 Otro sentido"
            descarta: true
            motivo: La palabra clave era un falso positivo.

  - id: productos_digitales
    nombre: Cursos, mentorías e infoproductos
    nivel: condicionado
    origen: propuesta
    por_que: >-
      Aplican, pero tienen más contracargos por "no recibí lo prometido". Las promesas de ingresos rápidos son una
      señal de esquema engañoso.
    palabras_clave: [infoproducto*, ebook*, e-book*, mentoria*, coaching, masterclass, webinar*, curso online,
      cursos online, curso en linea, cursos en linea, membresia digital, comunidad privada, descargable*]
    alternativas: [publicar_politicas]
    preguntas:
      - id: digitales_promesa
        clave: true
        texto: ¿El producto promete resultados económicos (ganar dinero, hacerse rico, ingresos rápidos)?
        corta: "¿Promete ganar dinero?"
        opciones:
          - id: "no"
            texto: No; enseña un tema o entrega contenido (idiomas, cocina, diseño, fitness, software)
            corto: "No, enseña un tema"
            nivel: aplica
            motivo: Educación o contenido digital sin promesas de ingresos.
          - id: si
            texto: Sí; promete ingresos, rendimientos o "libertad financiera"
            corto: "Sí, promete ingresos"
            nivel: comite
            motivo: Las promesas de ingresos tienen alto riesgo de reclamos y de esquemas engañosos; el comité decide.
            alternativas: [expediente_comite]

      - id: digitales_entrega
        texto: ¿Cómo demuestra que el cliente recibió el producto?
        corta: "¿Cómo prueba que el cliente lo recibió?"
        opciones:
          - id: plataforma
            texto: Acceso con usuario en una plataforma que registra el uso
            corto: "💻 Plataforma con usuario"
          - id: envio
            texto: Envío de archivos o enlaces por correo o WhatsApp
            corto: "📩 Por correo o WhatsApp"
            condiciones: [Guardar evidencia de entrega (correo, registro de descarga) para defender contracargos.]
          - id: en_vivo
            texto: Sesiones en vivo
            corto: "🎥 Sesiones en vivo"
            condiciones: [Guardar el registro de asistencia de las sesiones para defender contracargos.]

  - id: salud
    nombre: Salud, medicamentos y suplementos
    nivel: condicionado
    origen: propuesta
    por_que: >-
      Los servicios de salud y la venta de medicamentos o suplementos aplican con sus permisos sanitarios. Los productos
      sin registro o de uso controlado son de alto riesgo.
    palabras_clave: [farmacia*, medicamento*, receta*, suplemento*, vitamina*, proteina*, peptido*, esteroide*,
      anabolic*, testosterona, sarms, cbd, cannabis, marihuana, canamo, kratom, bajar de peso, adelgaz*,
      quemador de grasa, quemadores de grasa, sildenafil, viagra, botox, acido hialuronico, clinica*, consultorio*,
      medico*, odontolog*, dentista*, cirugia*, laboratorio clinico]
    alternativas: [tramitar_licencia]
    preguntas:
      - id: salud_que_vende
        clave: true
        texto: ¿Qué vende exactamente?
        opciones:
          - id: servicios
            texto: Servicios de salud (consultas, odontología, terapias, laboratorio, procedimientos)
            corto: "🩺 Servicios de salud"
            nivel: condicionado
            motivo: Servicios de salud; aplica con la idoneidad del profesional o el permiso del establecimiento.
            documentos: [idoneidad_profesional]
          - id: farmacia
            texto: Medicamentos en una farmacia (local o a domicilio)
            corto: "💊 Farmacia"
            nivel: condicionado
            motivo: Farmacia; aplica con licencia de operación y regente. Los medicamentos con receta exigen validarla antes de vender.
            documentos: [licencia_farmacia]
          - id: suplementos
            texto: Suplementos, vitaminas, proteínas o productos naturales con registro sanitario
            corto: "🥤 Suplementos con registro"
            nivel: condicionado
            motivo: Suplementos; aplica con registro sanitario y sin promesas médicas.
            documentos: [registro_sanitario]
          - id: sin_registro
            texto: Productos sin registro sanitario, péptidos, hormonas, esteroides o productos para bajar de peso importados
            corto: "Productos sin registro"
            nivel: comite
            motivo: Productos de salud sin registro sanitario o de uso controlado; el comité decide (posible prohibición, por confirmar).
            documentos: [registro_sanitario]
            alternativas: [tramitar_licencia, afiliar_linea_permitida]
          - id: cannabis
            texto: Cannabis, CBD o derivados
            corto: "🌿 Cannabis o CBD"
            nivel: comite
            motivo: El cannabis medicinal solo se vende con licencia (Ley 242 de 2021; verificar con Legal); el comité decide.
            documentos: [licencia_farmacia]
          - id: controlados
            texto: Sustancias controladas, o medicamentos que requieren receta vendidos sin ella
            corto: "Sustancias controladas"
            nivel: no_aplica
            motivo: Venta de sustancias controladas sin control sanitario (propuesta).
          - id: estetica
            texto: Belleza y estética no médica (spa, uñas, peluquería, masajes)
            corto: "💅 Belleza y spa"
            descarta: true
            motivo: Belleza y estética; actividad permitida.

  - id: donaciones
    nombre: Donaciones y recaudación de fondos
    nivel: condicionado
    origen: propuesta
    por_que: >-
      Aplican cuando hay una organización verificable detrás. Las colectas para personas particulares son difíciles de
      verificar.
    palabras_clave: [donacion*, donativo*, ong, fundacion*, sin fines de lucro, benefic*, caridad, iglesia*,
      ofrenda*, diezmo*, colecta*, crowdfunding, causa social, recaudacion de fondos, gofundme]
    alternativas: [plan_personalizado]
    preguntas:
      - id: donaciones_quien
        clave: true
        texto: ¿Quién recibe el dinero?
        opciones:
          - id: organizacion
            texto: Una organización constituida (fundación, asociación, iglesia)
            corto: "🏛️ Una organización"
            nivel: condicionado
            motivo: Organización sin fines de lucro; aplica con su personería jurídica y puede optar por el Plan Personalizado.
            documentos: [personeria_ong, registro_publico]
            alternativas: [plan_personalizado]
          - id: persona
            texto: Una persona o causa particular (colecta para un tratamiento, un viaje, etc.)
            corto: "🙋 Una persona"
            nivel: comite
            motivo: Colectas para personas particulares; es difícil verificar el destino de los fondos, el comité decide.
            alternativas: [expediente_comite]
          - id: politica
            texto: Un partido, candidato o campaña política
            corto: "🗳️ Una campaña política"
            nivel: comite
            motivo: Donaciones políticas; tienen regulación electoral, el comité decide (por confirmar).
          - id: vende
            texto: No son donaciones; vende productos o servicios (aunque apoye una causa)
            corto: "🛍️ No, vende algo"
            descarta: true
            motivo: Es una venta normal, no una recaudación.

  # ───────────────────────────── Actividades que aplican (destinos de reclasificación) ─────────────────────────────

  - id: experiencias_eventos
    nombre: Experiencias, tours y eventos
    nivel: aplica
    origen: propuesta
    por_que: >-
      Turismo y entretenimiento aplican. El riesgo está en la entrega futura (el evento no ocurre o se cancela) y en
      quién presta el servicio.
    palabras_clave: [tour, tours, experiencias, experiencia gastronomica, experiencia turistica, excursion*, eventos,
      concierto*, festival*, boleteria*, venta de entradas, entradas para, tickets, city tour, aventura*, senderismo,
      pub crawl, bar hopping]
    alternativas: [publicar_politicas, anticipo_menor]
    preguntas:
      - id: eventos_quien_presta
        clave: true
        texto: ¿Quién presta el servicio o hace el evento?
        opciones:
          - id: propio
            texto: El mismo comercio (su guía, su equipo, su evento)
