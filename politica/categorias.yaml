# Categorías de actividad que el evaluador reconoce, con sus preguntas de aclaración.
#
# Cómo se lee (detalle en politica/README.md):
# - nivel: lo que pasa si la categoría se confirma y nadie la aclara.
#     aplica | condicionado (aplica con condiciones) | comite (requiere comité) | no_aplica
# - origen: publica = está en los términos y condiciones públicos de PagueloFacil.
#           propuesta = práctica de la industria (reglas de las marcas de tarjeta, riesgo, ley); Cumplimiento la valida.
# - palabras_clave: activan la categoría para PREGUNTAR, nunca para decidir. Sin tildes ni mayúsculas da igual;
#   un * al final acepta cualquier terminación (licor* = licor, licores, licorería).
# - preguntas: la primera marcada clave es la que aclara qué vende de verdad. Cada opción puede tener:
#     nivel + motivo     → nivel de la categoría con esa respuesta (gana el más alto)
#     tope               → nivel máximo de la categoría (para afiliar solo la parte permitida)
#     descarta: true     → la categoría no aplica (falso positivo)
#     activa: [ids]      → suma otras categorías (por ejemplo, el tour de bares activa experiencias)
#     condiciones, documentos, alternativas, servicio_comite
#   mostrar_si: {pregunta: [opciones]} → la pregunta aparece solo con esas respuestas.
version: "2026-10-28.2"
estado: propuesta

categorias:
  # ───────────────────────────── Lista pública de actividades no permitidas ─────────────────────────────

  - id: alcohol
    nombre: Bebidas alcohólicas
    nivel: no_aplica
    origen: publica
    por_que: >-
      Los términos y condiciones de PagueloFacil excluyen el alcohol y el tabaco. La restricción es sobre vender
      bebidas alcohólicas; un servicio donde las bebidas son un complemento se evalúa por el servicio.
    palabras_clave: [licor*, alcohol, alcoholic*, bebidas alcoholicas, cerveza*, cerveceria*, vino, vinos, vinoteca*,
      ron, whisky, whiskey, vodka, tequila, ginebra, aguardiente, destilado*, coctel*, cocteleria, mixologia,
      bar, bares, pub, pubs, cantina*, discoteca*, licoreria*, happy hour, cata, catas, cata de vinos,
      barra libre, open bar, bartender*, pub crawl, bar hopping]
    alternativas: [cobrar_solo_servicio, afiliar_linea_permitida]
    preguntas:
      - id: alcohol_que_paga
        clave: true
        texto: Cuando el cliente paga con PagueloFacil, ¿qué recibe exactamente?
        corta: "Cuando el cliente paga, ¿qué recibe?"
        ayuda: >-
          La política se aplica a lo que el cliente compra, no a las palabras con que el comercio describe su negocio.
          Caso real: un comercio declaró "venta de licor" y en realidad vendía tours por bares.
        opciones:
          - id: venta_directa
            texto: Bebidas alcohólicas para llevar o a domicilio (botellas, licorería, delivery, tienda en línea)
            corto: "🍾 Botellas o delivery"
            nivel: no_aplica
            motivo: La venta directa de bebidas alcohólicas está en la lista de actividades no permitidas.
          - id: experiencia
            texto: Una experiencia o servicio (tour, cata guiada, clase de coctelería, evento) que incluye bebidas
            corto: "🎟️ Una experiencia o tour"
            nivel: condicionado
            motivo: >-
              El cliente paga por una experiencia: la actividad es turismo o entretenimiento, no venta de licor.
            activa: [experiencias_eventos]
          - id: consumo_local
            texto: Comida o bebidas que se consumen en su propio local (restaurante, bar, discoteca)
            corto: "🍽️ Consumo en su local"
            nivel: condicionado
            motivo: >-
              Consumo en el local: es un restaurante o bar, no venta de licor para llevar (por confirmar con
              Cumplimiento si la restricción de alcohol cubre a los bares).
            activa: [restaurantes]
          - id: sin_alcohol
            texto: Nada con alcohol (accesorios, cristalería, bebidas sin alcohol, alcohol en gel u otro producto)
            corto: "🙅 Nada con alcohol"
            descarta: true
            motivo: No vende bebidas alcohólicas; la palabra clave era un falso positivo.

      - id: alcohol_peso
        clave: true
        mostrar_si: {alcohol_que_paga: [experiencia, consumo_local]}
        texto: ¿Qué parte de lo que cobra corresponde a bebidas alcohólicas?
        corta: "¿Cuánto del precio son bebidas?"
        ayuda: Si las bebidas son lo principal, el servicio puede ser una forma de vender licor.
        opciones:
          - id: menos_mitad
            texto: Menos de la mitad (lo central es el servicio, la guía o la comida)
            corto: "Menos de la mitad"
          - id: mas_mitad
            texto: La mitad o más (las bebidas son lo principal)
            corto: "La mitad o más"
            nivel: comite
            motivo: >-
              Las bebidas son la mayor parte de lo que se cobra: el comité decide si es un servicio o una venta de licor.
            alternativas: [cobrar_solo_servicio, expediente_comite]
          - id: no_sabe
            texto: No se sabe todavía
            corto: "No se sabe"
            condiciones: [Pedir al comercio el desglose del precio (servicio frente a bebidas).]
            documentos: [descripcion_ampliada]

      - id: alcohol_quien_vende
        clave: true
        mostrar_si: {alcohol_que_paga: [experiencia, consumo_local]}
        texto: ¿Quién vende o sirve las bebidas alcohólicas?
        corta: "¿Quién vende las bebidas?"
        opciones:
          - id: local_aliado
            texto: Los bares o locales aliados, con su propia licencia
            corto: "🍸 Los bares aliados"
            condiciones: [Las bebidas las vende el local aliado con su licencia; lo ideal es que el comercio cobre con PagueloFacil solo su servicio.]
            documentos: [acuerdo_locales_aliados]
            alternativas: [cobrar_solo_servicio]
          - id: propio_con_licencia
            texto: El mismo comercio, con licencia para vender alcohol
            corto: "✅ Él, con licencia"
            documentos: [licencia_alcohol]
          - id: propio_sin_licencia
            texto: El mismo comercio, sin licencia
            corto: "⚠️ Él, sin licencia"
            nivel: no_aplica
            motivo: >-
              Vende alcohol sin licencia: no se procesa hasta que la tenga o hasta que las bebidas las venda un local
              con licencia.
            alternativas: [tramitar_licencia, cobrar_solo_servicio]

      - id: alcohol_edad
        mostrar_si: {alcohol_que_paga: [experiencia, consumo_local]}
        texto: ¿Verifica que sus clientes sean mayores de edad (18 años o más)?
        corta: "¿Verifica que sean mayores de 18?"
        opciones:
          - id: si
            texto: Sí
            corto: "Sí"
          - id: "no"
            texto: "No"
            corto: "No"
            condiciones: [Verificar la mayoría de edad al reservar y al prestar el servicio.]
            alternativas: [verificacion_edad]

      - id: alcohol_excluir
        clave: true
        mostrar_si: {alcohol_que_paga: [venta_directa]}
        texto: ¿Vende además productos permitidos y acepta no cobrar el alcohol con PagueloFacil?
        corta: "¿Acepta no cobrar el licor con nosotros?"
        ayuda: Por ejemplo, un minisúper que vende comestibles y también licor.
        opciones:
          - id: si_mayoria_permitida
            texto: Sí, y lo permitido es la mayor parte de su negocio
            corto: "Sí, el licor es lo de menos"
            tope: condicionado
            motivo: Se afilia solo la línea permitida, con carta compromiso de exclusión.
            documentos: [carta_exclusion]
            alternativas: [afiliar_linea_permitida]
          - id: si_mayoria_alcohol
            texto: Sí, pero el alcohol es lo principal
            corto: "Sí, pero el licor es lo principal"
            tope: comite
            motivo: El alcohol es lo principal del negocio; el comité decide si la afiliación parcial es viable.
            documentos: [carta_exclusion]
            alternativas: [afiliar_linea_permitida, expediente_comite]
          - id: "no"
            texto: "No"
            corto: "No"

  - id: tabaco_vapeo
