[project]
name = "afilia-paguelofacil"
version = "0.1.0"
description = "Evaluador de elegibilidad de aliados comerciales para Cumplimiento de PagueloFacil"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
afilia-web = "afilia.web.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afilia*"]

[tool.setuptools.package-data]
"afilia.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
